<rect x="241" y="240" width="8" height="37" rx="3" fill="#E0E8EE" />
<path d="M263 258 H297 m-6 -5 6 5 -6 5" stroke="#9AAFBC" stroke-width="1.7" fill="none"/>
<rect x="308" y="234" width="72" height="48" rx="8" fill="#E7F6F2" />
<text x="321" y="265" font-size="22" fill="#0D827E" font-weight="600" >μA</text>
<text x="52" y="333" font-size="16" fill="#456677" font-weight="400" >Own mean reconstruction</text>
<rect x="422" y="135" width="368" height="237" rx="12" fill="#FFFFFF" stroke="#D8E3E9"/>
<rect x="442" y="157" width="5" height="24" rx="2" fill="#5C65B0" />
<text x="459" y="178" font-size="24" fill="#163B50" font-weight="700" >Cross-Chunk</text>
<text x="442" y="207" font-size="16" fill="#577180" font-weight="400" >Predict the adjacent span</text>
<rect x="442" y="234" width="73" height="48" rx="8" fill="#EDF0FF" />
<text x="459" y="265" font-size="22" fill="#5C65B0" font-weight="600" >μA</text>
<path d="M525 258 H561 m-6 -5 6 5 -6 5" stroke="#9AAFBC" stroke-width="1.7" fill="none"/>
<rect x="575" y="240" width="8" height="37" rx="3" fill="#E0E8EE" />
<rect x="589" y="240" width="8" height="37" rx="3" fill="#5C65B0" />
<rect x="603" y="240" width="8" height="37" rx="3" fill="#E0E8EE" />
<rect x="617" y="240" width="8" height="37" rx="3" fill="#5C65B0" />
<rect x="631" y="240" width="8" height="37" rx="3" fill="#E0E8EE" />
<path d="M653 258 H687 m-6 -5 6 5 -6 5" stroke="#9AAFBC" stroke-width="1.7" fill="none"/>
<rect x="698" y="234" width="72" height="48" rx="8" fill="#EDF0FF" />
<text x="711" y="265" font-size="22" fill="#5C65B0" font-weight="600" >μB</text>
<text x="442" y="333" font-size="16" fill="#456677" font-weight="400" >Both directions: A → B, B → A</text>
<rect x="812" y="135" width="368" height="237" rx="12" fill="#FFFFFF" stroke="#D8E3E9"/>
<rect x="832" y="157" width="5" height="24" rx="2" fill="#A86820" />
<text x="849" y="178" font-size="24" fill="#163B50" font-weight="700" >Joint-Chunk</text>
<text x="832" y="207" font-size="16" fill="#577180" font-weight="400" >Learn both with shared atoms</text>
<rect x="833" y="237" width="15" height="35" rx="3" fill="#45B3A5" />
<rect x="856" y="237" width="15" height="35" rx="3" fill="#45B3A5" />
