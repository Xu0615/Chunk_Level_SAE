<rect x="1109" y="237" width="15" height="35" rx="3" fill="#98A6D3" />
<rect x="1132" y="237" width="15" height="35" rx="3" fill="#98A6D3" />
<text x="832" y="301" font-size="16" fill="#456677" font-weight="400" >Full dictionary → own mean</text>
<text x="832" y="331" font-size="16" fill="#0D827E" font-weight="400" >Shared prefix → adjacent mean</text>
